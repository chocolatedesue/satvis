# Publish the built site to GitHub Pages.
#
# The project's own deploy target is Cloudflare Pages (scripts/deploy-pages.sh),
# which needs a credential and an ssh hop into a tailnet — neither of which a
# fork has. This workflow is the target a fork does have: the same `pnpm build`
# artifact, served from https://<owner>.github.io/<repo>/.
#
# Two things make that subpath work without any Vite configuration:
#
#   - `base: ""` in vite.config.ts already emits relative asset urls
#     (`./assets/…`), so the bundle does not care what path it is served from.
#     That is also why there is no `actions/configure-pages` step: its whole job
#     is to hand a static site generator the base path it must be built for, and
#     this one does not need to know. It was tried, and it fails on a repository
#     whose Pages site does not exist yet — `GITHUB_TOKEN` carries `pages: write`,
#     which permits *deploying* to a site, not *creating* one, so it answered
#     "Create Pages site failed: resource not accessible by integration" and took
#     the build down with it. Enabling Pages is one visit to
#     Settings → Pages → Source: GitHub Actions, and nothing in a workflow can
#     stand in for it.
#   - `actions/upload-pages-artifact` serves the artifact as-is, with no Jekyll
#     pass, so `public/_headers`, `public/_redirects` and `404.html` travel
#     untouched. `_redirects` is a Cloudflare feature and is inert here, which
#     costs the `/ot` route — it resolves through a 200 rewrite that only
#     Cloudflare performs, and 404s on Pages. Every other entry point is a real
#     file the MPA build emits.
#
# Two things are worse here than on Cloudflare, and are worth knowing rather
# than discovering:
#
#   - **The globe is capped at imagery level 2.** `data/imagery/` levels 3–5 are
#     generated by `pnpm update-imagery`, which needs docker; the build only
#     warns about their absence. Committed levels 0–2 ship.
#   - **There is no Worker**, so `/api/*` does not exist. The app probes it,
#     fails over to the static `data/gp/` snapshot, and the step below is what
#     puts that snapshot there. Generated Walker constellations need none of it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already publishing: a
# half-uploaded Pages artifact is a half-served site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Not `submodules: true` on the checkout: data/models is a second
      # repository, and a fork that cannot reach it should still deploy a globe
      # with satellites on it rather than fail. Without it the 3D models are the
      # one component with no fallback (see AGENTS.md).
      - name: Fetch the 3D-model submodule
        continue-on-error: true
        run: git submodule update --init --depth 1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm ci
      # The static element-set snapshot the app falls back to when no Worker
      # answers /api. Not fatal: CelesTrak firewalls by IP and answers a refused
      # source with HTTP 522 (AGENTS.md), and a fleet the orbit lab generates
      # itself needs no catalog at all — so a refused download costs the real
      # satellites and ships the rest.
      - name: Refresh the static satellite-data snapshot
        continue-on-error: true
        run: pnpm update-gp
      - name: Build project
        run: pnpm build
      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
