<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Satellite orbit visualization with CesiumJS" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
    <title>OT Satellite Orbit Visualization</title>
  </head>
  <body>
    <noscript><h1>JavaScript is not enabled, please check your browser settings.</h1></noscript>
    <div id="cesiumContainer"></div>
    <!-- Identical to index.html but for the title, and it exists so that /ot is a
         real file rather than a not-found path. The asset router can then answer it
         without waking the Worker, which is what lets `not_found_handling` be
         "404-page": every route that must serve the app has a page of its own, so
         everything left over is genuinely missing. The route still resolves its
         preset from the path at runtime (src/config/presets.ts). -->
    <div id="app" class="dark isolate" v-cloak></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
